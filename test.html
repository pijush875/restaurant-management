<!DOCTYPE html>
<html>
<head>
    <title>POST API Test</title>
</head>
<body>

    <h2>Restaurant API Test</h2>

    <button onclick="testAPI()">Send Data</button>

    <script>
        function testAPI() {

            fetch("http://localhost:3000/api/test", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: "Pijush",
                    role: "Developer"
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log(data);
            });

        }
    </script>

</body>
</html>
