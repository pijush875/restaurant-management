<!DOCTYPE html>
<html>
<head>
    <title>POST API Food</title>
</head>
<body>

    <h2>Restaurant API Test</h2>

    <button onclick="testAPI()">Send Data</button>

    <script>
        function testAPI() {
fetch("/api/food", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        name: "Chicken Biryani",
        price: 500
    })
})
.then(response => response.json())
.then(data => {
    console.log(data);
});

        }
    </script>

</body>
</html>
